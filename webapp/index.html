<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TonEscrow — Xavfsiz P2P Bitimlar</title>
  <meta name="theme-color" content="#0b0e14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="/js/telegram-web-app.js"></script>
  <script src="/js/tonconnect-ui.min.js"></script>
  <script>
    if (!window.TonConnectUI) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js';
      s.async = false;
      document.head.appendChild(s);
    }
  </script>
</head>
<body data-scheme="dark" data-theme-mode="dark">
  <div id="app">
    <header id="topbar" class="topbar" role="banner">
      <button id="tb-back" class="icon-btn hidden" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 19.5 8 12l7.5-7.5 1.4 1.4L10.8 12l6.1 6.1z"/></svg>
      </button>
      <div id="tb-title" class="topbar-title">TonEscrow</div>
      <button id="tb-action" class="icon-btn hidden" aria-label="Action"></button>
    </header>

    <main id="view" class="view-root" aria-live="polite" role="main"></main>

    <nav id="tabbar" class="tabbar" role="navigation" aria-label="Main navigation">
      <button class="tab-btn active" data-tab="#/home" aria-label="Bitimlar" aria-current="page">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
        <span>Bitimlar</span>
      </button>
      <button class="tab-btn tab-trade" data-tab="#/trade" aria-label="Savdo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12 12 4l9 8"/><path d="M7 14h10"/><path d="M7 10h10"/><path d="M7 18h10"/></svg>
        <span>Savdo</span>
      </button>
      <button class="tab-btn tab-new" data-tab="#/create" aria-label="Yangi bitim">
        <span class="fab-plus">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span>Yangi</span>
      </button>
      <button class="tab-btn tab-channels" data-tab="#/channels" aria-label="Kanallar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8l5-4-5-4Z" fill="currentColor" stroke="none"/></svg>
        <span>Kanallar</span>
      </button>
      <button class="tab-btn" data-tab="#/profile" aria-label="Hisob">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
        <span>Hisob</span>
      </button>
    </nav>
  </div>

  <div id="toast-root" aria-live="assertive"></div>
  <div id="sheet-root" role="dialog" aria-modal="true"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
