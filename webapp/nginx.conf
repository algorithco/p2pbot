# Frontend nginx — serves Mini App and proxies API to backend microservice
# Backend is reachable as http://backend:3000 inside escrow-net

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — seller-buyer channel must not be framed/clickjacked, nosniff, strict referrer
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS stub (enable when behind TLS terminator that sets X-Forwarded-Proto=https)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Gzip for static
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck endpoint
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy API to backend (micro-architecture: frontend :80 -> backend :3000)
    # Preserve original Host and X-Forwarded-* (for https when behind TLS)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        # Timeouts for long polling
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # TON Connect manifest — local dev & future full deploy (kept, but wallet now uses GitHub raw by default)
    # Proxies to backend dynamic manifest (per-origin). Keep for localhost testing and later prod domain.
    location = /tonconnect-manifest.json {
        proxy_pass http://backend:3000/tonconnect-manifest.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }

    # Also proxy openapi/docs if you want frontend to expose them (optional)
    location = /api/docs {
        proxy_pass http://backend:3000/api/docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }
    location = /api/openapi.json {
        proxy_pass http://backend:3000/api/openapi.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }
    location = /docs {
        proxy_pass http://backend:3000/docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }

    # Static Mini App — SPA fallback to index.html for client routing (#/home etc.)
    location / {
        try_files $uri $uri/ /index.html;
        # Cache bust assets via ?v=6 query — allow long cache but revalidate
        location ~* \.(css|js|svg|json)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
        # No cache for index.html (Telegram needs fresh)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
