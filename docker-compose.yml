# P2P escrow bot — micro-architecture (7 services)
#  frontend (webapp nginx :8080 -> backend :3000) | backend (API-only :3000, bot)
#  signer (W5 :3001) | ubot (:3002) | utradebot (:3003) | postgres (:5432)
#  cloudflared (tunnels ONLY frontend :80 -> public HTTPS for TON Connect + bot)
#
# Prerequisites:
#   1. cp backend/.env.example backend/.env       # BOT_TOKEN, ADMIN_TELEGRAM_IDS, SIGNER_URL, FRONTEND_URL
#   2. cp signer/.env.example signer/.env         # SIGNER_MNEMONIC (24 words), SIGNER_API_KEY
#   3. cp ubot/.env.example ubot/.env             # API_ID, API_HASH, TWO_FA_PASSWORD
#   4. cp utradebot/.env.example utradebot/.env   # UTRADE_BOT_TOKEN, API_ID/HASH, ENCRYPTION_KEY
#   5. docker compose up --build -d
#   6. Frontend (Telegram Mini App) → http://localhost:8080
#      Backend API (docs)         → http://localhost:3000/api/docs or /docs
#
# For production TLS (Telegram Mini App requires HTTPS public URL):
#   - Put frontend+backend behind Caddy/nginx (set WEBAPP_URL=https://your-domain, FRONTEND_URL same)
#   - Ensure POSTGRES_PASSWORD, SIGNER_API_KEY, UBOT_API_KEY, UTRADE_API_KEY are strong (32+ chars)
#
# Micro-architecture: each service is independently buildable/scalable, isolated network escrow-net.
#  - backend:3000 API-only (no static, SERVE_STATIC=false) — CORS allows frontend origin
#  - frontend:80 nginx — serves webapp/public, proxies /api/* -> backend:3000
#  - signer/ubot/utradebot: internal only (expose), health endpoints for monitoring

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escrow_password}
      POSTGRES_DB: escrow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signer:
    build:
      context: .
      dockerfile: signer/Dockerfile
    restart: unless-stopped
    env_file:
      - signer/.env
    expose:
      - "3001"
    # Uncomment to debug signer externally:
    # ports:
    #   - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Inside compose the DB host is the service name, not localhost.
      DATABASE_URL: postgres://escrow:${POSTGRES_PASSWORD:-escrow_password}@postgres:5432/escrow
      PORT: "3000"
      SIGNER_URL: http://signer:3001
      SERVE_STATIC: "false"
      # WEBAPP_URL / FRONTEND_URL come from backend/.env (env_file) — set to https://<cloudflare> for TON Connect + bot
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      signer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/info',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M

  frontend:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    # Frontend is static — no env_file needed, but allow override via WEBAPP_URL if needed
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  # Cloudflared — tunnels ONLY frontend (webapp) to public HTTPS.
  # - TON Connect manifest and bot menu button will use this public URL.
  # - Quick tunnel (no token, random trycloudflare.com): default, logs show URL.
  # - Named tunnel (stable): set CLOUDFLARE_TUNNEL_TOKEN in .env and uncomment `tunnel run` line.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick tunnel — no config needed, URL printed in `docker compose logs cloudflared`
    command: tunnel --url http://frontend:80 --no-autoupdate
    # Named tunnel (stable URL) — uncomment and provide token:
    # command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: if using named tunnel, ensure token is passed
    # environment:
    #   - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  ubot:
    build:
      context: .
      dockerfile: ubot/Dockerfile
    restart: unless-stopped
    env_file:
      - ubot/.env
    expose:
      - "3002"
    # Uncomment to debug ubot externally:
    # ports:
    #   - "3002:3002"
    volumes:
      - ubot_sessions:/app/ubot/sessions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  utradebot:
    build:
      context: .
      dockerfile: utradebot/Dockerfile
    restart: unless-stopped
    env_file:
      - utradebot/.env
    environment:
      # Ensure DB URL uses compose service hostname (env_file value may have localhost)
      DATABASE_URL: postgres://escrow:${POSTGRES_PASSWORD:-escrow_password}@postgres:5432/escrow
    expose:
      - "3003"
    # Uncomment if you want internal API externally:
    # ports:
    #   - "3003:3003"
    volumes:
      - utrade_sessions:/app/utradebot/sessions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - escrow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  pgdata:
    driver: local
  ubot_sessions:
    driver: local
  utrade_sessions:
    driver: local

networks:
  escrow-net:
    driver: bridge
    name: escrow-net
