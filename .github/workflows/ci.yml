name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, signer, ubot, utradebot, webapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

  audit:
    name: Dependency audit — ${{ matrix.package }}
    runs-on: ubuntu-latest
    continue-on-error: true # report loudly, do not block on transitive noise
    strategy:
      fail-fast: false
      matrix:
        package: [backend, signer, ubot, utradebot, webapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit production dependencies (high+)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high
